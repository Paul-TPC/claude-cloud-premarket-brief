[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brief"
version = "0.1.0"
description = "台股盤前資訊整理"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
